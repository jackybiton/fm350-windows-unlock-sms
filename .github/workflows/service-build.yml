name: Build .NET service

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: dotnet build src/Fm350Unlock.Service/Fm350Unlock.Service.csproj -c Release

      - name: Publish self-contained service
        shell: pwsh
        run: >-
          dotnet publish src/Fm350Unlock.Service/Fm350Unlock.Service.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/service-win-x64

      - name: Algorithm self-test
        shell: pwsh
        run: artifacts/service-win-x64/Fm350UnlockService.exe --self-test

      - name: Build SMS receiver
        shell: pwsh
        run: dotnet build src/Fm350Sms/Fm350Sms.csproj -c Release

      - name: SMS decoder self-test
        shell: pwsh
        run: |
          $p = Start-Process src/Fm350Sms/bin/Release/net10.0-windows10.0.26100.0/win-x64/Fm350Sms.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: fm350-unlock-service-win-x64
          path: artifacts/service-win-x64/Fm350UnlockService.exe
